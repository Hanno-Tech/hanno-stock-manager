services:
  db:
    image: postgres:16-alpine
    container_name: estoque_rapido_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque_rapido
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque_rapido"]
      interval: 5s
      timeout: 5s
      retries: 10

# As fotos dos itens ficam no Vercel Blob (store `doca-fotos`), inclusive em
# desenvolvimento — o MinIO local saiu junto com o storage S3-compatível.
volumes:
  db_data:
